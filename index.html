<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101821">
  <meta name="description" content="漫游不同地形上的街区，拆开建筑，看看一座城是怎么搭起来的。">
  <title>切开城市 · City Cutaway</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app" class="shell">
    <header class="header">
      <div class="identity">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><h1>切开城市</h1><div class="wordmark" lang="en">CITY CUTAWAY</div></div>
      </div>
      <a class="source" href="https://github.com/Elcongroo/city-cutaway" target="_blank" rel="noopener">GitHub 源码</a>
    </header>

    <nav id="places" class="places" aria-label="选择场景">
      <button type="button" data-route="atlas" aria-current="page">区域总览</button>
      <button type="button" data-route="plain">平原城区</button>
      <button type="button" data-route="river">河湾城区</button>
      <button type="button" data-route="hill">山地城镇</button>
      <button type="button" data-route="rural">农田村落</button>
      <button type="button" data-route="building" class="building-link"><span aria-hidden="true">▥</span> 建筑拆解</button>
    </nav>

    <div class="workspace">
      <section class="stage" aria-label="可旋转的三维模型">
        <div id="viewport" class="viewport"></div>
        <div class="view-heading"><h2 id="scene-title">一座城，四种地形。</h2><p id="scene-intro"></p></div>
        <div id="pins" class="pins" aria-label="模型中的地点"></div>
        <div class="camera-tools" aria-label="镜头">
          <button type="button" id="follow" aria-pressed="false" hidden>跟拍地铁</button>
          <button type="button" id="reset-view" class="reset-view" aria-label="重置视角" title="重置视角">⌖</button>
        </div>
        <div id="scene-state" class="scene-state" aria-live="polite" hidden></div>
        <div class="gesture-hint" aria-hidden="true"><span class="mouse-hint">拖动旋转 · 滚轮缩放</span><span class="touch-hint">拖动旋转 · 双指缩放</span></div>
        <p id="loading" class="loading" role="status">正在搭建场景…</p>
        <noscript><p class="loading">启用 JavaScript 后即可打开 3D 模型。</p></noscript>
      </section>

      <div class="controls" id="controls" hidden>
        <section class="depth-control" aria-label="剖面或拆解控制">
          <div class="control-heading"><label id="depth-label" for="depth">剖面深度</label><output id="depth-value" for="depth">14 m</output></div>
          <input type="range" id="depth" min="0" max="24" step="1" value="14">
          <div class="scale" id="scale" aria-hidden="true"></div>
        </section>
        <section class="rain-control" id="rain-control" aria-label="降雨实验" hidden>
          <div class="control-heading rain-heading"><span>降雨实验</span><span id="rain-status" class="experiment-status" role="status"></span></div>
          <div class="experiment-buttons">
            <button type="button" id="rain" aria-pressed="false">开始下雨</button>
            <button type="button" id="garden" aria-pressed="false">雨水花园</button>
            <button type="button" id="replay" disabled>重放</button>
          </div>
          <progress id="rain-progress" max="1" value="0" aria-label="降雨演示进度"></progress>
        </section>
      </div>

      <aside class="guide" aria-labelledby="guide-heading">
        <div class="guide-body">
          <p id="guide-label" class="guide-label">看懂一座城</p>
          <h3 id="guide-heading">出门以后，路是怎么接起来的？</h3>
          <p id="guide-copy" class="guide-copy">从山坡出发，沿着河流经过桥梁、街区和村道，看看同一片区域里，地形如何改变人走的路、水流的方向和房子的位置。</p>
          <div id="features" class="features" aria-label="观察位置"></div>
          <button id="story" class="primary-action" type="button" aria-pressed="false" hidden></button>
          <button id="building-cta" class="primary-action" type="button">拆解一栋临街楼</button>
        </div>
        <div class="guide-foot">
          <a id="reference" target="_blank" rel="noopener" hidden></a>
          <span>虚构区域 · 规划原理示意</span>
        </div>
      </aside>
    </div>
    <footer>建筑、地形和水流为简化模型</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
