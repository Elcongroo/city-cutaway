<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d151d">
  <meta name="description" content="从峡谷水库飞到潮滩和外海断崖，亲手试试泵站、船闸、潮水、隧道换气和建筑传力。">
  <meta property="og:title" content="切开城市｜你每天经过的地方，底下还有什么？">
  <meta property="og:description" content="一座可以飞过去、切开看、亲手做实验的海湾城市。">
  <title>切开城市 · City Cutaway</title>
  <link rel="stylesheet" href="./style.css?v=20261120.6">
</head>
<body>
  <main id="app" class="shell" data-mode="atlas">
    <header class="header">
      <div class="identity">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><h1>切开城市</h1><div class="wordmark" lang="en">CITY CUTAWAY</div></div>
      </div>
      <a class="source" href="https://github.com/Elcongroo/city-cutaway" target="_blank" rel="noopener">GitHub 源码</a>
    </header>
    <nav id="places" class="places" aria-label="飞往区域">
      <button data-route="atlas" type="button" aria-current="page">全域总览</button>
      <button data-route="reservoir" type="button">峡谷水库</button>
      <button data-route="hill" type="button">山谷</button>
      <button data-route="rural" type="button">河谷农田</button>
      <button data-route="lake" type="button">城中湖</button>
      <button data-route="plain" type="button">两岸城区</button>
      <button data-route="skyline" type="button">北岸新城</button>
      <button data-route="river" type="button" class="section-tab">江底剖面</button>
      <button data-route="harbor" type="button">入海港湾</button>
      <button data-route="tide" type="button">入海潮滩</button>
      <button data-route="offshore" type="button">外海航道</button>
      <button data-route="cliffs" type="button">外海断崖</button>
      <button data-route="building" type="button" class="building-tab">建筑拆解</button>
    </nav>

    <section class="discover-bar discovery-rail" aria-label="看不见的城市">
      <h2>看不见的城市</h2>
      <div id="case-buttons" class="case-buttons">
        <button data-case="pump" aria-pressed="false" type="button"><small>泵站</small><span>江底的水往哪走？</span></button>
        <button data-case="lock" aria-pressed="false" type="button"><small>船闸</small><span>船怎么爬坡？</span></button>
        <button data-case="tide" aria-pressed="false" type="button"><small>潮滩</small><span>哪片陆地会消失？</span></button>
        <button data-case="air" aria-pressed="false" type="button"><small>通风</small><span>隧道的风哪来的？</span></button>
        <button data-case="load" aria-pressed="false" type="button"><small>建筑</small><span>屋顶的重量去哪了？</span></button>
      </div>
    </section>
    <section class="stage" aria-label="可探索的海湾城市">
      <div id="viewport" class="viewport"></div>
      <div class="view-heading">
        <h2 id="scene-title">水从山里来，城市一路长到海边</h2>
        <p id="scene-intro">越过峡谷水库、两岸城区和潮滩，再到外海断崖。江底还有一座会报警的泵站。</p>
      </div>
      <div class="camera-tools" aria-label="画面">
        <div class="formats" aria-label="渲染方式">
          <button id="use-3d" type="button" aria-pressed="true">3D</button>
          <button id="use-map" type="button" aria-pressed="false">地图</button>
        </div>
        <button type="button" id="sunset" aria-pressed="false">夕照</button>
        <button type="button" id="night" aria-pressed="false">夜景</button>
        <button type="button" id="reset-view" aria-label="重置视角" title="重置视角">⌖</button>
        <button type="button" id="fullscreen" aria-label="全屏" title="全屏">⛶</button>
      </div>
      <div class="zoom-tools" aria-label="视角">
        <button type="button" id="zoom-in" aria-label="放大" title="放大">＋</button>
        <button type="button" id="zoom-out" aria-label="缩小" title="缩小">−</button>
        <button type="button" id="angle" aria-pressed="false">俯瞰</button>
      </div>
      <div class="flight-controls" aria-label="浏览方式">
        <button type="button" id="cut-cta" class="primary-action">切开江底</button>
        <button type="button" id="tour" aria-pressed="false">沿江巡游</button>
      </div>
      <div id="case-panel" class="case-panel" hidden>
        <div class="control-heading"><label id="case-label" for="case-level"></label><output id="case-value" for="case-level"></output></div>
        <input id="case-level" type="range" min="0" max="100" step="1" value="45">
        <p id="case-feedback" class="case-feedback" aria-live="polite"></p>
        <div id="study-steps" class="study-steps" hidden></div>
        <div id="pump-meter" class="pump-meter" hidden>
          <div class="control-heading"><span>集水井水位</span><output id="pump-height">42%</output></div>
          <meter id="pump-water" aria-label="集水井水位" min="0" max="100" low="65" high="81" optimum="0" value="42"></meter>
          <div id="pump-indicators" class="pump-indicators" aria-live="polite"></div>
          <div class="study-steps pump-actions">
            <button type="button" id="pump-storm">模拟暴雨</button>
            <button type="button" id="pump-primary" aria-pressed="true">主泵运行</button>
            <button type="button" id="pump-auto" aria-pressed="true">备用自动</button>
          </div>
        </div>
      </div>
      <div id="view-status" class="view-status" aria-live="polite"></div>
      <div class="gesture-hint" aria-hidden="true"><span class="mouse">拖动画面 · 滚轮缩放</span><span class="touch">拖动画面 · 双指缩放</span></div>
      <p id="loading" class="loading" role="status">正在搭建海湾城市…</p>
      <noscript><p class="loading">启用 JavaScript 后即可打开城市模型。</p></noscript>
    </section>

    <div class="below-stage">
      <div id="render-note" class="render-note" role="status" hidden></div>

      <div class="dock">
        <section class="controls" id="controls" aria-label="当前交互" hidden>
          <div id="pump-lab" class="pump-lab" hidden>
            <div class="control-heading"><label for="pump-inflow">进水强度</label><output id="pump-inflow-value" for="pump-inflow">55%</output></div>
            <input type="range" id="pump-inflow" min="0" max="100" step="1" value="55">
            <div id="pump-stages" class="features" aria-label="跟着水走"></div>
            <button type="button" id="pump-reset" class="secondary-action">重置泵站</button>
          </div>
          <div id="slider-panel" hidden>
            <div class="control-heading"><label id="range-label" for="depth">剖面深度</label><output id="range-value" for="depth">0 m</output></div>
            <input id="depth" type="range" min="0" max="30" step="1" value="0">
            <div class="scale" id="scale" aria-hidden="true"></div>
            <button type="button" id="follow" class="secondary-action" aria-pressed="false" hidden>跟拍地铁</button>
          </div>
          <div id="experiment-panel" hidden>
            <div class="control-heading"><span>观察实验</span><span id="experiment-note" class="experiment-note" role="status"></span></div>
            <div class="experiment-actions">
              <button type="button" id="experiment" class="secondary-action" aria-pressed="false"></button>
              <button type="button" id="garden" class="secondary-action" aria-pressed="false" hidden>雨水花园</button>
              <button type="button" id="replay" class="secondary-action" hidden disabled>重放</button>
            </div>
            <progress id="rain-progress" max="1" value="0" aria-label="降雨演示进度" hidden></progress>
          </div>
        </section>
        <aside class="guide" aria-labelledby="guide-heading">
          <div class="guide-copy">
            <h3 id="guide-heading">一条河能串起什么？</h3>
            <p id="guide-copy">山谷来水经过农田和两岸城区，接上城中湖，最后汇入海湾。</p>
          </div>
          <div id="features" class="features" aria-label="观察位置"></div>
          <div class="guide-actions">
            <a id="case-source" target="_blank" rel="noopener" hidden></a>
            <button type="button" id="share" class="secondary-action">复制场景链接</button>
            <span id="share-result" role="status"></span>
          </div>
          <label id="share-field" hidden>分享链接<input id="share-location" type="text" readonly></label>
        </aside>
      </div>
    </div>
    <footer>虚构海湾城市 · 地形、设施尺寸及实验数值为演示示意</footer>
  </main>
  <script type="module" src="./app.js?v=20261120.5.1"></script>
</body>
</html>
